# YOLO Dataset Configuration File
# Used by train.py to locate training, validation, and test data

# Root directory for all datasets
path: ./datasets

# Path to training images (relative to 'path')
# Example: ./datasets/images/train/
train: images/train

# Path to validation images (relative to 'path')
# Used during training to evaluate model
# Example: ./datasets/images/val/
val: images/val

# Path to test images (relative to 'path')
# Used for final evaluation after training
# Example: ./datasets/images/test/
test: images/test

# Number of classes in dataset
# We only detect drones, so this is 1
nc: 1

# Class names (in order of class IDs)
# Class ID 0 = 'drone'
names: ['drone']
